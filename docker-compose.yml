# Startfertiges Bündel: Qdrant + PhotoVault-API samt Oberfläche + Ollama.
#
# Ollama liegt mit im Bündel (Profil `ollama`, von start.bat eingeschaltet),
# damit niemand etwas installieren muss; mit NVIDIA-Karte reicht start.bat
# die GPU durch (Override), sonst rechnet der Prozessor. Wer schon ein
# Ollama hat, laesst das Profil aus und traegt im Wizard die Adresse ein --
# etwa http://host.docker.internal:11434 fuer eines auf diesem Rechner.
# Unter macOS ist das die bessere Wahl: Docker Desktop reicht dort keine
# GPU durch, ein natives Ollama nutzt Metal. PhotoVault laeuft auch ohne:
# Gesichter, Szenen, Datum und Suche funktionieren, nur die deutschen
# Bildbeschreibungen fehlen dann.
#
# Der normale Weg ist start.bat / start.sh: die Skripte schreiben .env und
# eine docker-compose.override.yml mit den Laufwerken des Rechners (lesend
# unter /host/<laufwerk>, die gewählten Fotoordner zusätzlich beschreibbar
# am selben Pfad) und öffnen den Browser auf /setup. Von Hand:
#
#   cp .env.example .env
#   docker compose up -d
#   → http://localhost:8000
#
# Die Fotos kommen dann aus der Override-Datei (siehe start.sh, Abschnitt
# "Laufwerke"), nicht aus dieser Datei.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # Das schlanke Image bringt weder curl noch wget mit; Qdrant selbst
      # kann aber nachsehen, ob sein Port offen ist.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    # Fertiges Image, sobald die Action eines gebaut hat; bis dahin (und für
    # Entwickler) baut compose selbst, wenn das Image lokal fehlt.
    #
    # Zwei Varianten: `latest` rechnet Gesichter und CLIP auf dem Prozessor,
    # `cuda` auf einer NVIDIA-Karte (~10x schneller beim Einlesen; CUDA 13,
    # Treiber ab 580). start.bat wählt `cuda`, wenn es Karte und Treiber
    # misst, und reicht sie in der Override auch an diesen Container durch;
    # wer das nicht will, setzt in der .env PHOTOVAULT_GPU=0. Die
    # Build-Argumente gelten nur für den lokalen Bau.
    image: ghcr.io/crack666/photovault:${PHOTOVAULT_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
        ORT: ${ORT_PACKAGE:-onnxruntime}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      # Quellenliste und Einstellungen liegen im gemounteten ./data, damit sie
      # einen Neubau des Containers überleben -- der Wizard erstellt ihn nach
      # der Ordnerwahl neu (beschreibbare Mounts), und start.bat liest die
      # gewählten Ordner aus derselben Datei.
      PHOTOVAULT_SOURCES: /app/data/sources.txt
      PHOTOVAULT_SETTINGS: /app/data/settings.json
      # Wo der Ordnerwähler anfängt: die Laufwerke, nichts vom Container.
      PHOTOVAULT_BROWSE_ROOT: /host
      # Nach der Ordnerwahl wartet die Seite auf den Neustart durch start.bat.
      PHOTOVAULT_TWO_PHASE: "1"
      # Aus nvidia-smi auf dem Host (start.bat); 0 = keine NVIDIA-Karte.
      GPU_VRAM_MB: ${GPU_VRAM_MB:-0}
      # Wo Ollama ohne weitere Angabe gesucht wird: das aus dem Buendel. Eine
      # *Vorgabe*, keine Festlegung -- die Adresse im Wizard (data/settings.json)
      # gewinnt darueber, damit ein eigenes Ollama eingetragen werden kann.
      # OLLAMA_URL in der .env dagegen naegelt es fest (Umgebung > Datei).
      PHOTOVAULT_OLLAMA_DEFAULT: http://ollama:11434
      OLLAMA_URL: ${OLLAMA_URL:-}
      # Nur fuer einen LiteLLM-Pool (Entwicklungsmaschine); leer heisst: keiner.
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      PHOTOVAULT_CAPTION_MODEL: ${PHOTOVAULT_CAPTION_MODEL:-}
      PHOTOVAULT_EMBED_MODEL: ${PHOTOVAULT_EMBED_MODEL:-}
      MODEL_DIR: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Die Fotos kommen aus docker-compose.override.yml (von start.bat /
      # start.sh erzeugt): alle festen Laufwerke lesend unter /host, die
      # gewählten Quellen zusätzlich beschreibbar am selben Pfad. Schreiben
      # dürfen Papierkorb, Verschieben und exif_repair damit genau dort, wo
      # die Fotos liegen -- und nirgends sonst.
      #
      # Lange Läufe startet die Jobs-Seite als Kind *in diesem Container*.
      # Beenden ist SIGTERM an deren Prozessgruppe, nicht `pkill` auf dem Host
      # und nicht `docker kill`.
      #
      # Quellenliste, Einstellungen, Protokolle: auf dem Host, neben dem Skript.
      - ./data:/app/data
      # Modellgewichte (insightface, CLIP) überleben so einen Neubau des Images.
      - model_cache:/models
      # Vorschaubilder. Ohne dieses Volume liegen sie im Container und sind
      # nach jedem `--build` weg -- 14.593 Originale müssten dann wieder
      # über die Leitung. Benanntes Volume und kein Bind-Mount auf den
      # Projektordner: unter WSL liegt der auf NTFS über 9p, und das ist
      # gemessen viermal langsamer als die Linux-Platte (0,89 ms gegen
      # 3,62 ms je Kachel).
      - thumb_cache:/app/data/thumbs
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    # Modelle liegen im Volume `ollama_models` -- 5 bis 20 GB je nach Wahl,
    # auf der Docker-Platte (unter Windows in der WSL-VHDX). Die GPU kommt
    # aus docker-compose.override.yml, wenn start.bat eine NVIDIA-Karte
    # gemessen hat; ohne Karte rechnet der Prozessor.
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
  thumb_cache:
  ollama_models:
