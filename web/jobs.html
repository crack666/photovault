<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhotoVault — Jobs</title>
  <link rel="stylesheet" href="/static/styles.css?v=69" />
  <link rel="stylesheet" href="/static/core/ui.css?v=69" />
  <link rel="stylesheet" href="/static/jobs.css?v=69" />
</head>
<body>
  <header class="top">
    <div class="brand">PhotoVault</div>
    <nav id="nav"></nav>
  </header>

  <main class="view wide">
    <h1>Jobs</h1>

    <div class="starters" id="starters"></div>
    <div id="gaps" class="gaps hidden"></div>
    <p id="run-msg"></p>

    <!-- Welche Ordner eingelesen werden. Steht auf der Jobs-Seite, weil die
         Antwort darauf entscheidet, was die Laeufe darunter zu tun haben. -->
    <section class="src" id="src">
      <h2>Welche Ordner eingelesen werden</h2>
      <p class="muted src-lead">
        Der Haken sagt „beim naechsten Lauf mitnehmen“. Abwaehlen nimmt nichts
        aus dem Index — die Fotos bleiben, bis sie aufgeraeumt werden.
        <em id="src-file"></em>
      </p>
      <div id="src-list" class="src-list"></div>
      <div class="src-add">
        <button type="button" id="src-new" class="mini">Ordner hinzufuegen …</button>
        <button type="button" id="src-preview" class="mini">Trockenlauf: was wuerde gefunden?</button>
        <span id="src-msg" class="muted"></span>
      </div>
      <div id="src-result" class="src-result hidden"></div>
    </section>

    <div class="job-bar">
      <label>Art
        <select id="filter-kind"><option value="">alle</option></select>
      </label>
      <span class="spacer"></span>
      <span id="meta" class="muted"></span>
      <button id="prune">Liste aufräumen</button>
    </div>

    <div id="jobs" class="jobs"></div>
    <p style="max-width:60rem;text-align:center">
      <button id="more" class="hidden">Mehr laden</button>
    </p>
  </main>

<script type="module">
import { renderNav } from "/static/core/nav.js?v=69";
import { notify, openModal } from "/static/core/modal.js?v=69";

renderNav(document.getElementById("nav"), { active: "jobs" });

const PAGE = 20;
let limit = PAGE;
let kind = "";

const fmtDur = (s) => {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : (m ? `${m}m ${s % 60}s` : `${s}s`);
};
const fmtTime = (t) => t ? new Date(t * 1000).toLocaleString("de-DE") : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badgeClass = (s) => ({
  running: "b-running", done: "b-done", stale: "b-stale",
}[s] || (String(s).includes("error") ? "b-error" : "b-done"));


// Die Jobs-Seite hat absichtlich keine gemeinsame App-Basis: sie soll auch
// laufen, wenn der Rest kaputt ist. Also drei kleine Helfer statt eines
// Imports, der alles mitzieht.
const num = (n) => Number(n ?? 0).toLocaleString("de-DE");
async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...opts,
  });
  const text = await r.text();
  if (!r.ok) throw new Error(`${r.status} ${text.slice(0, 200)}`);
  return text ? JSON.parse(text) : {};
}

const msg = (text) => { document.getElementById("run-msg").textContent = text || ""; };

/* ---- Läufe anstoßen ---------------------------------------------------- */

function renderStarters(runnable) {
  const box = document.getElementById("starters");
  // Nur neu zeichnen, wenn sich etwas geändert hat -- sonst springt der Fokus
  // bei jedem Zwei-Sekunden-Tick weg.
  const sig = JSON.stringify(runnable);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.innerHTML = (runnable || []).map(r => {
    const off = r.busy || !r.ready;
    return `
    <div class="starter${r.ready ? "" : " blocked"}">
      <h3>${esc(r.label)}</h3>
      <p>${esc(r.note)}</p>
      ${r.gpu ? `<span class="gpu">belegt die Grafikkarte</span>` : ""}
      ${r.ready ? "" : `<span class="why">${esc(r.blocked)}</span>`}
      <div class="row">
        ${r.dry_run ? `<button data-run="${r.id}" data-dry="1" ${off ? "disabled" : ""}>Trockenlauf</button>` : ""}
        <button class="go" data-run="${r.id}" ${off ? "disabled" : ""}>${
          r.busy ? "läuft" : r.ready ? "Starten" : "nicht möglich"}</button>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("starters").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-run]");
  if (!b) return;
  const dry = !!b.dataset.dry;
  const label = b.closest(".starter").querySelector("h3").textContent;
  if (!dry) {
    const dlg = openModal({
      title: label,
      lead: "Der Lauf startet losgelöst und läuft weiter, auch wenn du die Seite "
          + "schließt. Beenden geht dann nur im Terminal.",
      buttons: [{ id: "cancel", label: "Abbrechen" },
                { id: "go", label: "Starten", kind: "primary" }],
    });
    if (await dlg.wait() !== "go") return;
  }
  msg("startet …");
  try {
    const res = await fetch("/api/jobs/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ job: b.dataset.run, dry_run: dry }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    msg(`${label}: gestartet (PID ${data.pid}). ${data.note} Protokoll: ${data.log}`);
  } catch (err) {
    msg(`Start fehlgeschlagen: ${err.message}`);
  }
  tick();
});

/* ---- Aufräumen --------------------------------------------------------- */

document.getElementById("prune").onclick = async () => {
  const dlg = openModal({
    title: "Erledigte Einträge aufräumen",
    lead: "Entfernt <b>abgebrochene</b> Einträge — Läufe ohne Lebenszeichen. "
        + "Laufende bleiben, und je Art bleiben die drei jüngsten stehen. "
        + "Die Läufe selbst sind davon nicht betroffen, nur ihre Zeilen hier.",
    body: `<label class="mv-hide"><input type="checkbox" id="also-done"> auch
           abgeschlossene entfernen
           <span>dann bleibt nur, was noch läuft, plus die drei jüngsten je Art</span></label>`,
    buttons: [{ id: "cancel", label: "Abbrechen" },
              { id: "go", label: "Aufräumen", kind: "danger" }],
  });
  const alsoDone = document.getElementById("also-done");
  if (await dlg.wait() !== "go") return;
  const what = alsoDone.checked ? "finished" : "aborted";
  try {
    const res = await fetch("/api/jobs/prune", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ what, keep_per_kind: 3 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    msg(`${data.deleted} Einträge entfernt, ${data.kept} behalten.`);
  } catch (err) {
    msg(`Aufräumen fehlgeschlagen: ${err.message}`);
  }
  tick();
};

document.getElementById("jobs").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-forget]");
  if (!b) return;
  try {
    const res = await fetch(`/api/jobs/${encodeURIComponent(b.dataset.forget)}`,
                            { method: "DELETE" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
  } catch (err) {
    msg(`Vergessen fehlgeschlagen: ${err.message}`);
  }
  tick();
});

document.getElementById("filter-kind").onchange = (e) => {
  kind = e.target.value; limit = PAGE; tick();
};
document.getElementById("more").onclick = () => { limit += PAGE; tick(); };

/* ---- Liste ------------------------------------------------------------- */

function render(data) {
  const box = document.getElementById("jobs");
  const jobs = data.jobs || [];
  document.getElementById("meta").textContent =
    `${data.running} laufend · ${data.returned} von ${data.total} gezeigt`;

  const sel = document.getElementById("filter-kind");
  const want = ["", ...(data.kinds || [])];
  if (sel.dataset.sig !== want.join()) {
    sel.dataset.sig = want.join();
    sel.innerHTML = want.map(k =>
      `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${k || "alle"}</option>`).join("");
  }
  document.getElementById("more").classList.toggle("hidden", data.returned >= data.total);

  if (!jobs.length) {
    box.innerHTML = "<p class='none'>Noch keine Jobs. Oben einen starten.</p>";
    return;
  }
  box.innerHTML = jobs.map(j => {
    const pct = Math.min(100, Number(j.percent) || 0);
    const done = j.status !== "running";
    return `
      <div class="job">
        ${done ? `<button class="job-forget" data-forget="${esc(j.job_id)}"
                   title="Diesen Eintrag vergessen">✕</button>` : ""}
        <div class="job-head">
          <span class="job-kind">${esc(j.kind || "job")}</span>
          <span class="badge ${badgeClass(j.status)}">${esc(j.status)}</span>
          <span class="job-src">${esc(j.source || "")}</span>
        </div>
        <div class="bar ${done ? "done" : ""}"><i style="width:${pct}%"></i></div>
        <div class="nums">
          <span><b>${j.processed ?? 0}</b> / ${j.total ?? 0} (${pct.toFixed(1)}%)</span>
          ${j.errors ? `<span style="color:#e88c89"><b>${j.errors}</b> Fehler</span>` : ""}
          ${j.skipped ? `<span>${j.skipped} übersprungen</span>` : ""}
          <span><b>${(Number(j.rate_per_s) || 0).toFixed(2)}</b>/s</span>
          <span>Laufzeit ${fmtDur(j.elapsed_s)}</span>
          ${!done && j.eta_s ? `<span>ETA ${fmtDur(j.eta_s)}</span>` : ""}
          <span>${esc(j.phase || "")}</span>
        </div>
        <div class="nums" style="opacity:.5">
          <span>gestartet ${fmtTime(j.started_at)}</span>
          ${j.finished_at ? `<span>fertig ${fmtTime(j.finished_at)}</span>` : ""}
        </div>
      </div>`;
  }).join("");
}

async function renderGaps() {
  const box = document.getElementById("gaps");
  try {
    const s = await (await fetch("/api/ingest/state")).json();
    const gaps = s.gaps || [];
    box.classList.toggle("hidden", !gaps.length);
    box.innerHTML = gaps.map(g => `
      <div class="gap">
        <b>${g.missing.toLocaleString("de-DE")}</b>
        <span>von ${s.total.toLocaleString("de-DE")} Fotos ohne ${esc(g.vector)}-Vektor
          — ${esc(g.means)}</span>
        <i>${esc(g.remedy)}</i>
      </div>`).join("");
  } catch (e) {
    box.classList.add("hidden");
  }
}

async function tick() {
  try {
    const url = `/api/jobs?limit=${limit}${kind ? `&kind=${encodeURIComponent(kind)}` : ""}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderStarters(data.runnable);
    render(data);
  } catch (e) {
    document.getElementById("meta").textContent = `API nicht erreichbar: ${e.message}`;
  }
}
tick();
renderGaps();
setInterval(tick, 2000);
// Der Zustand ändert sich nur nach einem Lauf -- alle 30 s genügt.
setInterval(renderGaps, 30000);

/* ---- Welche Ordner eingelesen werden ---------------------------------

   `sources.txt` entscheidet, was ueberhaupt existiert. Bis jetzt ging das
   nur im Editor -- fuer eine Entscheidung dieser Tragweite zu versteckt.

   Drei Dinge sind hier wichtiger als Bequemlichkeit:

   Die Datei bleibt die Wahrheit. Ein Haken setzt oder entfernt genau ein
   '#'; Reihenfolge, Einrueckung und handgeschriebene Notizen bleiben. In
   dieser Datei steht hinter jeder Zeile die gefundene Bilderzahl -- eine
   Oberflaeche, die die Datei neu generiert, wirft das weg.

   Ein Ordner, den es nicht gibt, wird als solcher gezeigt. Im Texteditor
   sieht eine tote Ausschlusszeile genauso aus wie eine wirksame, und dann
   schuetzt sie nichts, ohne dass es auffaellt.

   Und der Trockenlauf steht neben dem Speichern, nicht dahinter: ein Haken
   kann einen stundenlangen Lauf ausloesen. */

const srcState = { entries: [], file: "" };

async function loadSources() {
  const box = document.getElementById("src-list");
  box.textContent = "lädt …";
  let d;
  try {
    d = await api("/api/sources");
  } catch (e) {
    box.innerHTML = `<p class="muted">Quellenliste nicht lesbar: ${
      esc(String(e.message || e))}</p>`;
    return;
  }
  srcState.entries = d.entries;
  srcState.file = d.file;
  document.getElementById("src-file").textContent = d.file;
  paintSources();
}

function paintSources() {
  const box = document.getElementById("src-list");
  const ein = srcState.entries.filter((e) => !e.exclude);
  const aus = srcState.entries.filter((e) => e.exclude);

  const zeile = (e) => `
    <label class="src-row${e.enabled ? " on" : ""}${e.exists ? "" : " ghost"}">
      <input type="checkbox" data-line="${e.line}"${e.enabled ? " checked" : ""}>
      <span class="src-path">${esc(e.path)}</span>
      ${e.exists ? "" : `<span class="src-warn" title="Diesen Ordner gibt es nicht — die Zeile wirkt nicht">gibt es nicht</span>`}
      ${e.photos > 0 ? `<span class="src-count">${num(e.photos)} im Index</span>` : ""}
      ${e.note ? `<span class="src-note">${esc(e.note)}</span>` : ""}
    </label>`;

  box.innerHTML = `
    <h3>Quellen <em>${ein.filter((e) => e.enabled).length} von ${ein.length} aktiv</em></h3>
    ${ein.map(zeile).join("")}
    <h3>Ausschlüsse <em>${aus.filter((e) => e.enabled).length} von ${aus.length} aktiv</em></h3>
    <p class="muted src-sub">Gelten innerhalb der Quellen darüber.</p>
    ${aus.map(zeile).join("")}`;

  box.querySelectorAll("input[data-line]").forEach((cb) => {
    cb.addEventListener("change", () => toggleSource(Number(cb.dataset.line), cb.checked, cb));
  });
}

async function toggleSource(line, enabled, cb) {
  const e = srcState.entries.find((x) => x.line === line);
  cb.disabled = true;
  try {
    await api("/api/sources/toggle", {
      method: "POST", body: JSON.stringify({ line, enabled }),
    });
  } catch (err) {
    cb.checked = !enabled;   // zurückdrehen, sonst zeigt der Haken etwas Falsches
    cb.disabled = false;
    notify(`Konnte nicht speichern: ${err.message || err}`, { kind: "error" });
    return;
  }
  cb.disabled = false;
  if (e) e.enabled = enabled;
  paintSources();

  // Was das bedeutet, gehört dazu -- und zwar der unangenehme Teil zuerst.
  if (!enabled && e && e.photos > 0 && !e.exclude) {
    notify(`„${e.path}“ wird nicht mehr nachgeladen. Die ${num(e.photos)} Fotos `
         + "bleiben im Index, bis „Liste aufräumen“ sie entfernt.", { ms: 12000 });
  } else if (enabled && e && !e.exists) {
    notify(`Angehakt, aber „${e.path}“ gibt es nicht — die Zeile wirkt nicht.`,
           { kind: "error" });
  } else {
    notify("Gespeichert. Wirkt beim nächsten Lauf.");
  }
}

async function previewSources() {
  const btn = document.getElementById("src-preview");
  const out = document.getElementById("src-result");
  btn.disabled = true;
  const alt = btn.textContent;
  btn.textContent = "zählt …";
  document.getElementById("src-msg").textContent = "geht die Ordner durch — über das Netz dauert das";
  let d;
  try {
    d = await api("/api/sources/preview");
  } catch (e) {
    document.getElementById("src-msg").textContent = "";
    out.classList.remove("hidden");
    out.innerHTML = `<p class="muted">Zählen fehlgeschlagen: ${
      esc(String(e.message || e))}</p>`;
    btn.disabled = false; btn.textContent = alt;
    return;
  }
  btn.disabled = false; btn.textContent = alt;
  document.getElementById("src-msg").textContent = "";
  out.classList.remove("hidden");
  out.innerHTML = `
    <table class="src-table">
      <thead><tr><th>Quelle</th><th>auf der Platte</th><th>im Index</th><th>Unterschied</th></tr></thead>
      <tbody>${d.per_source.map((r) => {
        const diff = r.found - (r.in_index < 0 ? 0 : r.in_index);
        return `<tr>
          <td>${esc(r.path)}</td>
          <td class="n">${num(r.found)}</td>
          <td class="n">${r.in_index < 0 ? "?" : num(r.in_index)}</td>
          <td class="n${diff > 0 ? " plus" : ""}">${diff > 0 ? `+${num(diff)}` : "0"}</td>
        </tr>`;
      }).join("")}</tbody>
      <tfoot><tr><th>gesamt</th><th class="n">${num(d.total)}</th><th></th><th></th></tr></tfoot>
    </table>
    ${d.missing?.length ? `<p class="muted warn">Nicht vorhanden und deshalb ohne Wirkung:
      ${d.missing.map((p) => esc(p)).join(", ")}</p>` : ""}
    <p class="muted">${esc(d.note || "")}</p>`;
}

/* Ordner auswählen statt eintippen.

   Nicht aus Bequemlichkeit: von 34 Zeilen dieser Datei zeigen zwölf auf
   Ordner, die es nicht mehr gibt. Getippte Pfade veralten still -- eine tote
   Ausschlusszeile sieht im Editor aus wie eine wirksame. Wer nur auswählen
   kann, was da ist, legt solche Zeilen gar nicht erst an.

   Je Ordner steht dabei, wieviele Bilder direkt darin liegen: sonst klickt
   man blind durch einen Baum und weiß am Ende nicht, ob man die Ebene mit
   den Fotos erwischt hat. */
async function pickFolder(start = "/mnt/photo") {
  const dlg = openModal({
    title: "Ordner auswählen",
    lead: "Ein Klick auf einen Namen geht hinein. Die Zahl sagt, wieviele "
        + "Bilder direkt darin liegen — Unterordner sind nicht mitgezählt.",
    body: '<div class="pick" id="pick">lädt …</div>',
    buttons: [
      { id: "cancel", label: "Abbrechen" },
      { id: "exclude", label: "Als Ausschluss" },
      { id: "include", label: "Als Quelle", kind: "primary" },
    ],
  });

  let hier = start;

  async function zeige(p) {
    const box = document.getElementById("pick");
    box.innerHTML = "lädt …";
    let d;
    try {
      d = await api(`/api/sources/browse?path=${encodeURIComponent(p)}`);
    } catch (e) {
      box.innerHTML = `<p class="muted">Nicht lesbar: ${esc(String(e.message || e))}</p>`;
      return;
    }
    hier = d.path;
    const teile = d.path.split("/").filter(Boolean);
    box.innerHTML = `
      <div class="pick-crumbs">
        <button type="button" data-go="/">/</button>
        ${teile.map((t, i) => `<button type="button" data-go="/${
          teile.slice(0, i + 1).join("/")}">${esc(t)}</button>`).join("<span>/</span>")}
      </div>
      <p class="pick-here">Gewählt: <b>${esc(d.path)}</b></p>
      <div class="pick-list">
        ${d.dirs.length ? d.dirs.map((x) => `
          <button type="button" class="pick-row${x.listed ? " known" : ""}" data-go="${esc(x.path)}">
            <span class="pick-name">${esc(x.name)}</span>
            <span class="pick-n">${x.images}${x.truncated ? "+" : ""} Bilder</span>
            ${x.has_subdirs ? '<span class="pick-sub">Unterordner</span>' : ""}
            ${x.listed ? `<span class="pick-tag">${
              x.listed === "exclude" ? "Ausschluss" : "Quelle"}${
              x.enabled ? "" : ", aus"}</span>` : ""}
          </button>`).join("")
        : '<p class="muted">Keine Unterordner.</p>'}
      </div>`;
    box.querySelector(".pick-crumbs").onclick = (e) => {
      const b = e.target.closest("[data-go]");
      if (b) zeige(b.dataset.go);
    };
    box.querySelector(".pick-list").onclick = (e) => {
      const b = e.target.closest("[data-go]");
      if (b) zeige(b.dataset.go);
    };
  }

  await zeige(start);
  const antwort = await dlg.wait();
  if (antwort !== "include" && antwort !== "exclude") return null;
  return { path: hier, exclude: antwort === "exclude" };
}

async function addSource() {
  // Als Startpunkt der oberste bereits eingetragene Ordner -- man sucht fast
  // immer einen Nachbarn dessen, was schon drinsteht.
  const erste = srcState.entries.find((e) => !e.exclude);
  const wahl = await pickFolder(erste ? erste.path.replace(/\/[^/]+$/, "") || "/" : "/");
  if (!wahl) return;
  try {
    await api("/api/sources/add", {
      method: "POST", body: JSON.stringify({ path: wahl.path, exclude: wahl.exclude }),
    });
  } catch (e) {
    notify(`Nicht hinzugefügt: ${e.message || e}`, { kind: "error" });
    return;
  }
  notify(`${wahl.exclude ? "Ausschluss" : "Quelle"} hinzugefügt. `
       + "Der Trockenlauf zeigt, was dazukommt.");
  await loadSources();
}

document.getElementById("src-preview").addEventListener("click", previewSources);
document.getElementById("src-new").addEventListener("click", addSource);
loadSources();

</script>
</body>
</html>
