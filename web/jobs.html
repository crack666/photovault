<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhotoVault — Jobs</title>
  <link rel="stylesheet" href="/static/styles.css?v=9" />
  <link rel="stylesheet" href="/static/core/ui.css?v=3" />
  <style>
    .jobs { display: flex; flex-direction: column; gap: .75rem; max-width: 60rem; }
    .job {
      border: 1px solid var(--line, #2a2f36); border-radius: 10px;
      padding: .9rem 1.05rem; display: flex; flex-direction: column; gap: .55rem;
      background: var(--card, #161a1f); position: relative;
    }
    .job-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
    .job-kind { font-weight: 600; }
    .job-src { font-size: .82rem; opacity: .6; font-family: ui-monospace, monospace;
               overflow-wrap: anywhere; }
    .badge {
      font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
      padding: .16rem .48rem; border-radius: 999px; font-weight: 600;
      font-family: ui-monospace, monospace;
    }
    .b-running { background: #123b46; color: #5cc8dc; }
    .b-done    { background: #123020; color: #5cbe8a; }
    .b-stale   { background: #3a2a0e; color: #d8ae4c; }
    .b-error   { background: #3a1c1b; color: #e88c89; }
    .bar { height: .5rem; border-radius: 999px; background: #2a2f36; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: #5cc8dc; transition: width .4s ease; }
    .bar.done > i { background: #5cbe8a; }
    .nums {
      display: flex; gap: 1.35rem; flex-wrap: wrap;
      font-family: ui-monospace, monospace; font-size: .8rem; opacity: .82;
      font-variant-numeric: tabular-nums;
    }
    .nums b { opacity: 1; }
    .none { opacity: .6; }

    /* Einen Eintrag vergessen. Nur den Eintrag -- der Lauf ist längst vorbei. */
    .job-forget {
      position: absolute; top: .5rem; right: .5rem;
      width: 26px; height: 26px; padding: 0;
      border-radius: 7px; background: transparent; color: var(--muted);
      border: 1px solid transparent; font-size: .7rem; opacity: 0;
      transition: opacity .12s;
    }
    .job:hover .job-forget, .job-forget:focus { opacity: 1; }
    .job-forget:hover { background: #3a2422; border-color: #6b3a38; color: #e8b0ad; }

    /* ---- Läufe anstoßen ------------------------------------------------ */

    .starters {
      display: grid; gap: .6rem; max-width: 60rem; margin: 0 0 1.6rem;
      grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    }
    .starter {
      display: flex; flex-direction: column; gap: .4rem;
      padding: .85rem 1rem; border-radius: 12px;
      background: #161a1f; border: 1px solid #2a2f36;
    }
    .starter h3 { margin: 0; font-size: .95rem; }
    .starter p { margin: 0; font-size: .78rem; color: var(--muted); line-height: 1.45; }
    .starter .row { display: flex; gap: .4rem; margin-top: .25rem; flex-wrap: wrap; }
    .starter button {
      min-height: 36px; padding: 0 .8rem; border-radius: 9px;
      background: #232a36; border: 1px solid #3a4353; color: #ccd5e2; font-size: .82rem;
    }
    .starter button:hover:not(:disabled) { background: #2f3847; color: var(--text); }
    .starter button.go { background: var(--accent); border-color: transparent; color: #0b1020; font-weight: 600; }
    .starter button.go:hover:not(:disabled) { background: #a3c5ff; }
    .starter button:disabled { opacity: .45; }
    .starter .gpu { font-size: .68rem; color: #d8ae4c; }
    /* Fehlt eine Voraussetzung, steht der Grund da statt eines Knopfs, der
       „gestartet" sagt und dann nichts tut. */
    .starter.blocked { border-color: #4a3a2a; }
    .starter .why {
      font-size: .74rem; color: #e0a13c; line-height: 1.4;
      background: #2a2214; border-radius: 7px; padding: .35rem .5rem;
    }

    .job-bar {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      margin: 0 0 .9rem; max-width: 60rem;
    }
    .job-bar .spacer { flex: 1; }
    .job-bar button {
      min-height: 34px; padding: 0 .75rem; border-radius: 8px;
      background: #232a36; border: 1px solid #3a4353; color: #ccd5e2; font-size: .8rem;
    }
    .job-bar button:hover { background: #2f3847; color: var(--text); }
    .job-bar select {
      background: #232a36; color: #cdd5e1; border: 1px solid #2f3747;
      border-radius: 7px; padding: 5px 8px; font-size: .8rem;
    }
    #run-msg { margin: 0 0 1rem; font-size: .84rem; color: var(--accent); min-height: 1.2em; }

    /* Was im Index fehlt. Nicht mitgezählt, sondern abgefragt -- ein Zähler
       gilt nur für einen Lauf, der Zustand gilt immer. */
    .gaps { max-width: 60rem; margin: 0 0 1.2rem; display: flex; flex-direction: column; gap: .4rem; }
    .gap {
      display: flex; gap: .7rem; align-items: baseline; flex-wrap: wrap;
      padding: .55rem .8rem; border-radius: 9px;
      background: #2a2214; border: 1px solid #4a3a2a; font-size: .82rem;
    }
    .gap b { color: #e0a13c; font-variant-numeric: tabular-nums; }
    .gap span { color: #c9b8a0; }
    .gap i { font-style: normal; color: var(--muted); font-size: .76rem; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">PhotoVault</div>
    <nav id="nav"></nav>
  </header>

  <main class="view wide">
    <h1>Jobs</h1>

    <div class="starters" id="starters"></div>
    <div id="gaps" class="gaps hidden"></div>
    <p id="run-msg"></p>

    <div class="job-bar">
      <label>Art
        <select id="filter-kind"><option value="">alle</option></select>
      </label>
      <span class="spacer"></span>
      <span id="meta" class="muted"></span>
      <button id="prune">Liste aufräumen</button>
    </div>

    <div id="jobs" class="jobs"></div>
    <p style="max-width:60rem;text-align:center">
      <button id="more" class="hidden">Mehr laden</button>
    </p>
  </main>

<script type="module">
import { renderNav } from "/static/core/nav.js?v=33";
import { openModal } from "/static/core/modal.js?v=33";

renderNav(document.getElementById("nav"), { active: "jobs" });

const PAGE = 20;
let limit = PAGE;
let kind = "";

const fmtDur = (s) => {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : (m ? `${m}m ${s % 60}s` : `${s}s`);
};
const fmtTime = (t) => t ? new Date(t * 1000).toLocaleString("de-DE") : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badgeClass = (s) => ({
  running: "b-running", done: "b-done", stale: "b-stale",
}[s] || (String(s).includes("error") ? "b-error" : "b-done"));

const msg = (text) => { document.getElementById("run-msg").textContent = text || ""; };

/* ---- Läufe anstoßen ---------------------------------------------------- */

function renderStarters(runnable) {
  const box = document.getElementById("starters");
  // Nur neu zeichnen, wenn sich etwas geändert hat -- sonst springt der Fokus
  // bei jedem Zwei-Sekunden-Tick weg.
  const sig = JSON.stringify(runnable);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.innerHTML = (runnable || []).map(r => {
    const off = r.busy || !r.ready;
    return `
    <div class="starter${r.ready ? "" : " blocked"}">
      <h3>${esc(r.label)}</h3>
      <p>${esc(r.note)}</p>
      ${r.gpu ? `<span class="gpu">belegt die Grafikkarte</span>` : ""}
      ${r.ready ? "" : `<span class="why">${esc(r.blocked)}</span>`}
      <div class="row">
        ${r.dry_run ? `<button data-run="${r.id}" data-dry="1" ${off ? "disabled" : ""}>Trockenlauf</button>` : ""}
        <button class="go" data-run="${r.id}" ${off ? "disabled" : ""}>${
          r.busy ? "läuft" : r.ready ? "Starten" : "nicht möglich"}</button>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("starters").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-run]");
  if (!b) return;
  const dry = !!b.dataset.dry;
  const label = b.closest(".starter").querySelector("h3").textContent;
  if (!dry) {
    const dlg = openModal({
      title: label,
      lead: "Der Lauf startet losgelöst und läuft weiter, auch wenn du die Seite "
          + "schließt. Beenden geht dann nur im Terminal.",
      buttons: [{ id: "cancel", label: "Abbrechen" },
                { id: "go", label: "Starten", kind: "primary" }],
    });
    if (await dlg.wait() !== "go") return;
  }
  msg("startet …");
  try {
    const res = await fetch("/api/jobs/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ job: b.dataset.run, dry_run: dry }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    msg(`${label}: gestartet (PID ${data.pid}). ${data.note} Protokoll: ${data.log}`);
  } catch (err) {
    msg(`Start fehlgeschlagen: ${err.message}`);
  }
  tick();
});

/* ---- Aufräumen --------------------------------------------------------- */

document.getElementById("prune").onclick = async () => {
  const dlg = openModal({
    title: "Erledigte Einträge aufräumen",
    lead: "Entfernt <b>abgebrochene</b> Einträge — Läufe ohne Lebenszeichen. "
        + "Laufende bleiben, und je Art bleiben die drei jüngsten stehen. "
        + "Die Läufe selbst sind davon nicht betroffen, nur ihre Zeilen hier.",
    body: `<label class="mv-hide"><input type="checkbox" id="also-done"> auch
           abgeschlossene entfernen
           <span>dann bleibt nur, was noch läuft, plus die drei jüngsten je Art</span></label>`,
    buttons: [{ id: "cancel", label: "Abbrechen" },
              { id: "go", label: "Aufräumen", kind: "danger" }],
  });
  const alsoDone = document.getElementById("also-done");
  if (await dlg.wait() !== "go") return;
  const what = alsoDone.checked ? "finished" : "aborted";
  try {
    const res = await fetch("/api/jobs/prune", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ what, keep_per_kind: 3 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    msg(`${data.deleted} Einträge entfernt, ${data.kept} behalten.`);
  } catch (err) {
    msg(`Aufräumen fehlgeschlagen: ${err.message}`);
  }
  tick();
};

document.getElementById("jobs").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-forget]");
  if (!b) return;
  try {
    const res = await fetch(`/api/jobs/${encodeURIComponent(b.dataset.forget)}`,
                            { method: "DELETE" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
  } catch (err) {
    msg(`Vergessen fehlgeschlagen: ${err.message}`);
  }
  tick();
});

document.getElementById("filter-kind").onchange = (e) => {
  kind = e.target.value; limit = PAGE; tick();
};
document.getElementById("more").onclick = () => { limit += PAGE; tick(); };

/* ---- Liste ------------------------------------------------------------- */

function render(data) {
  const box = document.getElementById("jobs");
  const jobs = data.jobs || [];
  document.getElementById("meta").textContent =
    `${data.running} laufend · ${data.returned} von ${data.total} gezeigt`;

  const sel = document.getElementById("filter-kind");
  const want = ["", ...(data.kinds || [])];
  if (sel.dataset.sig !== want.join()) {
    sel.dataset.sig = want.join();
    sel.innerHTML = want.map(k =>
      `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${k || "alle"}</option>`).join("");
  }
  document.getElementById("more").classList.toggle("hidden", data.returned >= data.total);

  if (!jobs.length) {
    box.innerHTML = "<p class='none'>Noch keine Jobs. Oben einen starten.</p>";
    return;
  }
  box.innerHTML = jobs.map(j => {
    const pct = Math.min(100, Number(j.percent) || 0);
    const done = j.status !== "running";
    return `
      <div class="job">
        ${done ? `<button class="job-forget" data-forget="${esc(j.job_id)}"
                   title="Diesen Eintrag vergessen">✕</button>` : ""}
        <div class="job-head">
          <span class="job-kind">${esc(j.kind || "job")}</span>
          <span class="badge ${badgeClass(j.status)}">${esc(j.status)}</span>
          <span class="job-src">${esc(j.source || "")}</span>
        </div>
        <div class="bar ${done ? "done" : ""}"><i style="width:${pct}%"></i></div>
        <div class="nums">
          <span><b>${j.processed ?? 0}</b> / ${j.total ?? 0} (${pct.toFixed(1)}%)</span>
          ${j.errors ? `<span style="color:#e88c89"><b>${j.errors}</b> Fehler</span>` : ""}
          ${j.skipped ? `<span>${j.skipped} übersprungen</span>` : ""}
          <span><b>${(Number(j.rate_per_s) || 0).toFixed(2)}</b>/s</span>
          <span>Laufzeit ${fmtDur(j.elapsed_s)}</span>
          ${!done && j.eta_s ? `<span>ETA ${fmtDur(j.eta_s)}</span>` : ""}
          <span>${esc(j.phase || "")}</span>
        </div>
        <div class="nums" style="opacity:.5">
          <span>gestartet ${fmtTime(j.started_at)}</span>
          ${j.finished_at ? `<span>fertig ${fmtTime(j.finished_at)}</span>` : ""}
        </div>
      </div>`;
  }).join("");
}

async function renderGaps() {
  const box = document.getElementById("gaps");
  try {
    const s = await (await fetch("/api/ingest/state")).json();
    const gaps = s.gaps || [];
    box.classList.toggle("hidden", !gaps.length);
    box.innerHTML = gaps.map(g => `
      <div class="gap">
        <b>${g.missing.toLocaleString("de-DE")}</b>
        <span>von ${s.total.toLocaleString("de-DE")} Fotos ohne ${esc(g.vector)}-Vektor
          — ${esc(g.means)}</span>
        <i>${esc(g.remedy)}</i>
      </div>`).join("");
  } catch (e) {
    box.classList.add("hidden");
  }
}

async function tick() {
  try {
    const url = `/api/jobs?limit=${limit}${kind ? `&kind=${encodeURIComponent(kind)}` : ""}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderStarters(data.runnable);
    render(data);
  } catch (e) {
    document.getElementById("meta").textContent = `API nicht erreichbar: ${e.message}`;
  }
}
tick();
renderGaps();
setInterval(tick, 2000);
// Der Zustand ändert sich nur nach einem Lauf -- alle 30 s genügt.
setInterval(renderGaps, 30000);
</script>
</body>
</html>
