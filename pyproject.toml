[project]
name = "photovault"
version = "0.1.0"
description = "Lokale Foto-Suche: Personen, Zeit, Ort, Szene"
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    "open-clip-torch>=2.24",
    "Pillow>=10.0",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart",
    "aiofiles",
    "numpy>=1.26",
    "torch>=2.2",
    # EXIF schreiben, ohne das JPEG neu zu kodieren.
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true